name: CI/CD Pipeline - Calidad y Pruebas

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  backend-tests:
    name: Backend - Pruebas Unitarias JUnit 5
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[Skip GitHub Action]')"
    defaults:
      run:
        working-directory: Backend
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Java 17 LTS
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Dar permisos de ejecución a Maven Wrapper
        run: chmod +x mvnw

      - name: Compilar y ejecutar pruebas unitarias JUnit
        run: ./mvnw test -Dtest=*ServiceTest

  frontend-tests:
    name: Frontend - Compilación y Accesibilidad Axe-Core
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[Skip GitHub Action]')"
    defaults:
      run:
        working-directory: Frontend
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: Frontend/package-lock.json

      - name: Instalar dependencias limpias
        run: npm ci

      - name: Compilar Angular 19 para producción
        run: npm run build

      - name: Ejecutar auditoría de accesibilidad (Cypress + Axe-Core)
        run: npx cypress run --spec "cypress/e2e/accesibilidad.cy.ts"
