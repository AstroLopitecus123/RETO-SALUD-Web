spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

server.port=${PORT:8080}

# JWT
jwt.secret=${JWT_SECRET:}
jwt.expirationMs=86400000

# Gmail SMTP
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME:dummy_email@gmail.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:dummy_password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Stripe
stripe.secret-key=${STRIPE_SECRET_KEY:}

# Twilio WhatsApp
twilio.account.sid=${TWILIO_ACCOUNT_SID:tu_sid_dummy}
twilio.auth.token=${TWILIO_AUTH_TOKEN:tu_token_dummy}
twilio.whatsapp.from=whatsapp:+14155238886

# TELECONSULTA CONFIG (AGORA + DEEPGRAM)
agora.appId=${AGORA_APP_ID:}
agora.appCertificate=${AGORA_APP_CERTIFICATE:}
deepgram.apiKey=${DEEPGRAM_API_KEY:}

# Google Auth
google.client.id=${GOOGLE_CLIENT_ID:473447043826-0d5crfghn3m7cug1ibfefnr24lsmp5g8.apps.googleusercontent.com}

# Cloudinary Configuration
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:dummy_cloud}
cloudinary.api-key=${CLOUDINARY_API_KEY:dummy_key}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:dummy_secret}

# Google reCAPTCHA v3
recaptcha.secret-key=${RECAPTCHA_SECRET_KEY:}
recaptcha.enabled=${RECAPTCHA_ENABLED:false}


# Frontend URL
app.frontend.url=${FRONTEND_URL:https://www.reto-salud.online}
